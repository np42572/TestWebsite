<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Boxes Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .game-container {
            position: relative;
            width: 600px;
            height: 400px;
            background: linear-gradient(180deg, #87ceeb 0%, #e0f6ff 100%);
            border: 3px solid #333;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .score-board {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 5px;
        }

        .timer {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 5px;
        }

        .player {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            border-radius: 5px;
            border: 2px solid #c92a2a;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.1s;
            z-index: 5;
        }

        .player:hover {
            transform: translateX(-50%) scale(1.05);
        }

        .box {
            position: absolute;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            border-radius: 5px;
            border: 2px solid #daa500;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(400px);
            }
        }

        .game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .game-over-screen.show {
            display: flex;
        }

        .game-over-content h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ffd700;
        }

        .game-over-content p {
            font-size: 32px;
            margin-bottom: 30px;
        }

        .game-over-content button {
            font-size: 20px;
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .game-over-content button:hover {
            transform: scale(1.1);
        }

        .instructions {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #666;
            font-size: 12px;
            text-align: center;
            display: none;
        }

        @media (max-width: 600px) {
            .game-container {
                width: 90vw;
                height: 60vh;
                max-width: 600px;
                max-height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="score-board">Score: <span id="score">0</span></div>
        <div class="timer">Time: <span id="timer">30</span>s</div>
        <div class="player" id="player"></div>
        
        <div class="game-over-screen" id="gameOverScreen">
            <div class="game-over-content">
                <h1>Game Over!</h1>
                <p>Final Score: <span id="finalScore">0</span></p>
                <button onclick="location.reload()">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        const gameContainer = document.querySelector('.game-container');
        const player = document.getElementById('player');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScore');

        let score = 0;
        let timeLeft = 30;
        let gameActive = true;
        let playerX = gameContainer.clientWidth / 2 - 25;
        let playerY = gameContainer.clientHeight - 60;
        const playerWidth = 50;
        const playerHeight = 50;
        const boxWidth = 40;
        const boxHeight = 40;

        // Player movement
        document.addEventListener('mousemove', (e) => {
            if (!gameActive) return;
            
            const rect = gameContainer.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            
            // Keep player within bounds
            playerX = Math.max(0, Math.min(mouseX - 25, gameContainer.clientWidth - playerWidth));
            player.style.left = playerX + 'px';
        });

        // Collision detection
        function checkCollision(boxX, boxY) {
            return boxX < playerX + playerWidth &&
                   boxX + boxWidth > playerX &&
                   boxY < playerY + playerHeight &&
                   boxY + boxHeight > playerY;
        }

        // Spawn falling boxes
        function spawnBox() {
            if (!gameActive) return;

            const box = document.createElement('div');
            box.className = 'box';
            
            const randomX = Math.random() * (gameContainer.clientWidth - boxWidth);
            box.style.left = randomX + 'px';
            box.style.top = '-40px';
            
            const duration = 2 + Math.random() * 2; // 2-4 seconds to fall
            box.style.animationDuration = duration + 's';
            
            gameContainer.appendChild(box);

            let boxX = randomX;
            let boxY = -40;
            let caught = false;

            // Collision check loop
            const checkInterval = setInterval(() => {
                if (!gameActive || caught) {
                    clearInterval(checkInterval);
                    return;
                }

                // Calculate current box position based on animation progress
                const progress = (duration - (duration * 1000 - (Date.now() % (duration * 1000))) / (duration * 1000)) || 0;
                boxY = -40 + (progress * gameContainer.clientHeight);

                // Check collision with player
                if (checkCollision(boxX, boxY)) {
                    score++;
                    scoreDisplay.textContent = score;
                    caught = true;
                    box.remove();
                    clearInterval(checkInterval);
                }
            }, 50);

            // Remove after falling off screen
            setTimeout(() => {
                clearInterval(checkInterval);
                if (box.parentNode) {
                    box.remove();
                }
            }, duration * 1000);
        }

        // Spawn boxes regularly
        let spawnInterval = setInterval(() => {
            if (gameActive) {
                spawnBox();
            }
        }, 800);

        // Timer countdown
        let timerInterval = setInterval(() => {
            if (gameActive) {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }
        }, 1000);

        // End game
        function endGame() {
            gameActive = false;
            clearInterval(spawnInterval);
            clearInterval(timerInterval);
            
            finalScoreDisplay.textContent = score;
            gameOverScreen.classList.add('show');
        }
    </script>
</body>
</html>
